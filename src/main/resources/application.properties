spring.application.name=api 

app.database.name=code_axis_db_dev
spring.datasource.url=jdbc:mysql://localhost:3306/${app.database.name}
spring.datasource.username=codeaxisAppServiceAcc
spring.datasource.password=codeaxisFuison#

# Validate entity mappings against database schema
spring.jpa.hibernate.ddl-auto=validate

# Disable Spring's internal DDL generation logic (aka disableautomatic schema generation)
spring.jpa.generate-ddl=false

# Disable automatic bean validation at the JPA level
# This prevents errors if your Java fields don't perfectly match your DB constraints
spring.jpa.properties.jakarta.persistence.validation.mode=none

# MySQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
spring.jpa.show-sql=true

spring.web.error.include-message=always

# Enable exception throwing for missing routes
spring.web.resources.add-mappings=false

# Smtp config
spring.mail.host=mail.fusion5-tech.com
spring.mail.port=465
spring.mail.username=dheeraj@fusion5-tech.com
spring.mail.password=${CODE_AXIS_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# Frontend
app.frontend.base-url=http://localhost:3000
app.frontend.verify-email-path=/verify-email

# Add naming strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
