<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Corporate Login</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>

    body{
      margin:0;
      padding:0;
      font-family:'Inter',Poppins;
      background:#F9FAFB;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .login-card{
      width:380px;
      background:#F9FAFB;
      padding:35px 30px;
      border-radius:16px;
      box-shadow:0 4px 15px rgba(0,0,0,0.08);
    }

    .logo-title{
      text-align:center;
      color:#4F46E5;
      font-size:42px;
      font-weight:700;
      margin-bottom:8px;
    }

    .sub-title{
      text-align:center;
      color:#6B7280;
      font-size:15px;
      margin-bottom:30px;
    }

    .form-label{
      font-size:15px;
      font-weight:500;
      margin-bottom:8px;
      color:#111827;
    }

    .form-control{
      height:48px;
      border-radius:8px;
      border:1px solid #D1D5DB;
      font-size:15px;
      padding-left:14px;
    }

    .form-control:focus{
      border-color:#4F46E5;
      box-shadow:0 0 0 0.20rem rgba(79,70,229,0.20);
    }

    .form-check-label{
      font-size:14px;
      color:#374151;
    }

    .forgot-link{
      text-decoration:none;
      color:#4F46E5;
      font-size:14px;
      font-weight:500;
    }

    .forgot-link:hover{
      text-decoration:underline;
    }

    .btn-login{
      background:#4F46E5;
      border:none;
      height:46px;
      border-radius:8px;
      font-size:17px;
      font-weight:600;
      transition:0.3s;
    }

    .btn-login:hover{
      background:#4338CA;
    }

    .register-text{
      text-align:center;
      margin-top:22px;
      font-size:15px;
      color:#6B7280;
    }

    .register-text a{
      color:#4F46E5;
      text-decoration:none;
      font-weight:600;
    }

    .register-text a:hover{
      text-decoration:underline;
    }

    .social-icons{
      margin-top:22px;
      display:flex;
      justify-content:center;
      gap:14px;
    }

    .social-icons a{
      width:40px;
      height:40px;
      background:#EEF2FF;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#4F46E5;
      text-decoration:none;
      font-size:18px;
      transition:0.3s;
    }

    .social-icons a:hover{
      background:#4F46E5;
      color:#ffffff;
      transform:translateY(-2px);
    }

  </style>
</head>

<body>

  <div class="login-card">

    <!-- Heading -->
    <h1 class="logo-title">
      Code Axis
    </h1>

    <p class="sub-title">
      Corporate Authentication
    </p>

    <!-- Form -->
    <form class="needs-validation" novalidate>

      <!-- Email -->
      <div class="mb-3">

        <label class="form-label">
          Email
        </label>

        <input
          type="email"
          class="form-control"
          placeholder="Enter email"
          required
        >

        <div class="invalid-feedback">
          Please enter a valid email.
        </div>

      </div>

      <!-- Password -->
      <div class="mb-3">

        <label class="form-label">
          Password
        </label>

        <input
          type="password"
          class="form-control"
          placeholder="Enter password"
          minlength="8"
          required
        >

        <div class="invalid-feedback">
          Password must be at least 8 characters.
        </div>

      </div>

      <!-- Remember -->
      <div class="d-flex justify-content-between align-items-center mb-4">

        <div class="form-check">

          <input
            class="form-check-input"
            type="checkbox"
            id="remember"
          >

          <label class="form-check-label" for="remember">
            Remember me
          </label>

        </div>

        <a href="#" class="forgot-link">
          Forgot?
        </a>

      </div>

      <!-- Button -->
      <div class="d-grid">

        <button
          type="submit"
          class="btn btn-primary btn-login"
        >
          Login
        </button>

      </div>

    </form>

    <!-- Register -->
    <div class="register-text">
      Don’t have an account?
      <a href="#">
        Register
      </a>
    </div>

    <!-- Social Icons -->
    <div class="social-icons">

      <a href="#">
        <i class="bi bi-google"></i>
      </a>

      <a href="#">
        <i class="bi bi-facebook"></i>
      </a>

      <a href="#">
        <i class="bi bi-github"></i>
      </a>

      <a href="#">
        <i class="bi bi-linkedin"></i>
      </a>

    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Validation -->
  <script>

    (() => {
      'use strict'

      const forms = document.querySelectorAll('.needs-validation')

      Array.from(forms).forEach(form => {

        form.addEventListener('submit', event => {

          if (!form.checkValidity()) {

            event.preventDefault()
            event.stopPropagation()

          }

          form.classList.add('was-validated')

        }, false)

      })

    })()

  </script>

</body>
</html>
