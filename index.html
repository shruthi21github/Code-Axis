<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Employee Table UI</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <style>
    body{
      background: #f4f7fc;
      font-family: Arial, sans-serif;
    }

    .table-container{
      max-width: 1100px;
      margin: 50px auto;
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .title-section{
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .title-section h2{
      font-weight: bold;
      color: #222;
    }

    .search-box{
      width: 280px;
    }

    .table{
      border-radius: 12px;
      overflow: hidden;
    }

    .table thead{
      background: #0d6efd;
      color: white;
    }

    .table tbody tr:hover{
      background-color: #eef4ff;
      transition: 0.3s;
    }

    .badge{
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 20px;
    }

    .btn-action{
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      margin: 2px;
      color: white;
    }

    .btn-edit{
      background: #0d6efd;
    }

    .btn-delete{
      background: #dc3545;
    }

    .pagination{
      justify-content: end;
      margin-top: 20px;
    }

    @media(max-width:768px){
      .title-section{
        flex-direction: column;
        align-items: start;
        gap: 15px;
      }

      .search-box{
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="table-container">

      <!-- Header -->
      <div class="title-section">
        <h2>Modern Employee Table</h2>

        <!-- Search -->
        <input
          type="text"
          class="form-control search-box"
          placeholder="Search employee..."
          id="searchInput"
        />
      </div>

      <!-- Filters -->
      <div class="row mb-3">
        <div class="col-md-3">
          <select class="form-select">
            <option selected>Filter Department</option>
            <option>UI Design</option>
            <option>Frontend</option>
            <option>Backend</option>
            <option>Developer</option>
          </select>
        </div>

        <div class="col-md-3">
          <select class="form-select">
            <option selected>Filter Status</option>
            <option>Active</option>
            <option>Working</option>
            <option>Pending</option>
          </select>
        </div>
      </div>

      <!-- Responsive Table -->
      <div class="table-responsive">

        <table class="table table-hover align-middle text-center">

          <thead>
            <tr>
              <th>ID</th>
              <th>Employee Name</th>
              <th>Department</th>
              <th>Email</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="employeeTable">

            <tr>
              <td>EMP001</td>
              <td>Sangeetha</td>
              <td>UI Design</td>
              <td>sangeetha@gmail.com</td>
              <td>
                <span class="badge bg-success">Active</span>
              </td>
              <td>
                <button class="btn-action btn-edit">
                  <i class="bi bi-pencil-square"></i>
                </button>

                <button class="btn-action btn-delete">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>

            <tr>
              <td>EMP002</td>
              <td>Praveen</td>
              <td>Frontend</td>
              <td>praveen@gmail.com</td>
              <td>
                <span class="badge bg-primary">Working</span>
              </td>
              <td>
                <button class="btn-action btn-edit">
                  <i class="bi bi-pencil-square"></i>
                </button>

                <button class="btn-action btn-delete">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>

            <tr>
              <td>EMP003</td>
              <td>Raghuram Saireddy</td>
              <td>Developer</td>
              <td>raghuram@gmail.com</td>
              <td>
                <span class="badge bg-warning text-dark">Pending</span>
              </td>
              <td>
                <button class="btn-action btn-edit">
                  <i class="bi bi-pencil-square"></i>
                </button>

                <button class="btn-action btn-delete">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>

          </tbody>

        </table>

      </div>

      <!-- Pagination -->
      <nav>
        <ul class="pagination">

          <li class="page-item disabled">
            <a class="page-link">Previous</a>
          </li>

          <li class="page-item active">
            <a class="page-link">1</a>
          </li>

          <li class="page-item">
            <a class="page-link">2</a>
          </li>

          <li class="page-item">
            <a class="page-link">3</a>
          </li>

          <li class="page-item">
            <a class="page-link">Next</a>
          </li>

        </ul>
      </nav>

    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Search Function -->
  <script>
    const searchInput = document.getElementById("searchInput");
    const tableRows = document.querySelectorAll("#employeeTable tr");

    searchInput.addEventListener("keyup", function () {

      const searchValue = this.value.toLowerCase();

      tableRows.forEach(row => {

        const text = row.innerText.toLowerCase();

        if(text.includes(searchValue)){
          row.style.display = "";
        } else {
          row.style.display = "none";
        }

      });

    });
  </script>

</body>
</html>
