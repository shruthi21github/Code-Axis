<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dark Dashboard</title>

  <link rel="stylesheet" href="../css/adminlte.css">
  <link rel="stylesheet" href="../css/custom.css">
</head>

<body data-theme="dark" style="background:#121212; color:white;">

<div class="container-fluid p-3">

  <h3>Dark Dashboard</h3>

  <div class="row mt-3">

    <div class="col-lg-3">
      <div class="card bg-dark text-white">
        <div class="card-body"><h3>120</h3><p>Employees</p></div>
      </div>
    </div>

    <div class="col-lg-3">
      <div class="card bg-dark text-white">
        <div class="card-body"><h3>94%</h3><p>Attendance</p></div>
      </div>
    </div>

    <div class="col-lg-3">
      <div class="card bg-dark text-white">
        <div class="card-body"><h3>18</h3><p>Projects</p></div>
      </div>
    </div>

    <div class="col-lg-3">
      <div class="card bg-dark text-white">
        <div class="card-body"><h3>86%</h3><p>Tasks</p></div>
      </div>
    </div>

  </div>

  <div class="card bg-dark text-white mt-4">
    <div class="card-body">
      <div id="revenue-chart"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="../js/custom.js"></script>

</body>
</html>
